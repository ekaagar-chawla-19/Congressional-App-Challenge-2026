[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hemlock-sentinel"
version = "0.1.0"
description = "Individual Eastern hemlock identification and longitudinal monitoring (multi-view re-identification)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "pyyaml>=6",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Training / full-precision inference. torch is installed separately on the Pi
# only if the Torch runtime is wanted; ONNX Runtime is enough for inference.
torch = ["torch>=2.1", "torchvision>=0.16", "timm>=1.0"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
app = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
assistant = ["anthropic>=1.15"]
esp32 = ["bleak>=0.22", "pyserial>=3.5"]
dev = ["pytest>=8", "httpx>=0.27", "psutil>=5.9"]

[project.scripts]
hemlock-app = "hemlock_sentinel.app.server:main"
hemlock-api = "hemlock_sentinel.api.server:main"
hemlock-esp32 = "hemlock_sentinel.esp32.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hemlock_sentinel.app" = ["static/*"]
"hemlock_sentinel.api" = ["static/*", "static/ort/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs pretrained weights or real data",
]
